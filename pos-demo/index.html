<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kape ni Juan POS</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link id="headFont" rel="stylesheet" href="">
<style id="sgStyle">
:root{
  --pri:#0f1b33;--pri2:#24304a;--pri3:#3a4560;--acc:#f5a142;--acc2:#f9c891;--acc3:#fdeedd;--onpri:#f9c891;--onacc:#0f1b33;
  --bg:#f5f7fb;--card:#fbfcfe;--ink:#17203a;--muted:#6b7590;--line:#e3e6ee;--hfont:'Poppins';
  --ok:#2f7d4f;--okbg:#e5f3ea;--bad:#b23b3b;--badbg:#f8e3e1;--warn:#b8740f;--warnbg:#fbefd9;
  --r:14px;--shadow:0 2px 10px rgba(20,20,40,.07);
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:var(--bg);color:var(--ink);font-size:15px;-webkit-tap-highlight-color:transparent}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
h1,h2,h3{font-family:var(--hfont),Georgia,serif;margin:0;color:var(--pri);font-weight:700}
.hidden{display:none!important}
.muted{color:var(--muted)}
.right{text-align:right}
.num{font-variant-numeric:tabular-nums}
.small{font-size:12px}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:10px 16px;border-radius:10px;background:#fff;border:1px solid var(--line);font-weight:600;min-height:42px;transition:.15s}
.btn:hover{border-color:var(--acc)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.primary{background:var(--pri);color:var(--onpri);border-color:var(--pri)}
.btn.primary:hover{background:var(--pri2)}
.btn.gold{background:var(--acc);color:var(--onacc);border-color:var(--acc)}
.btn.danger{background:var(--bad);color:#fff;border-color:var(--bad)}
.btn.ghost{background:transparent;border-color:transparent}
.btn.sm{padding:6px 10px;min-height:34px;font-size:13px}
.btn.block{width:100%}

input[type=text],input[type=number],input[type=password],input[type=date],input[type=search],select,textarea{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:#fff;min-height:42px;outline:none}
input:focus,select:focus,textarea:focus{border-color:var(--acc);box-shadow:0 0 0 3px color-mix(in srgb,var(--acc) 25%,transparent)}
input[type=color]{width:56px;height:42px;border:1px solid var(--line);border-radius:10px;padding:3px;background:#fff}
label{display:block;font-size:12px;font-weight:600;color:var(--muted);margin:10px 0 4px;text-transform:uppercase;letter-spacing:.03em}
label.ck{display:flex;gap:8px;align-items:center;text-transform:none;font-size:14px;color:var(--ink);font-weight:500;letter-spacing:0;margin:8px 0}
label.ck input{width:18px;height:18px;accent-color:var(--pri)}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:0 14px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:0 14px}
.full{grid-column:1/-1}
@media(max-width:640px){.grid2,.grid3{grid-template-columns:1fr}}

.badge{display:inline-block;padding:3px 8px;border-radius:99px;font-size:11px;font-weight:700;letter-spacing:.02em}
.b-ok{background:var(--okbg);color:var(--ok)}.b-bad{background:var(--badbg);color:var(--bad)}.b-warn{background:var(--warnbg);color:var(--warn)}.b-gold{background:var(--acc3);color:var(--pri)}

#app{display:flex;flex-direction:column;height:100vh;height:100dvh}
header.top{display:flex;align-items:center;gap:14px;padding:10px 16px;background:var(--pri);color:var(--onpri);flex-shrink:0}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.brand .t1{font-family:var(--hfont),serif;font-size:18px;font-weight:700;color:var(--onpri);line-height:1.1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:260px}
.brand .t2{font-size:10px;letter-spacing:.18em;text-transform:uppercase;opacity:.75}
.mono{width:38px;height:38px;border-radius:11px;background:var(--acc);color:var(--onacc);display:flex;align-items:center;justify-content:center;font-family:var(--hfont),serif;font-weight:700;font-size:20px;flex-shrink:0}
.logo-img{width:38px;height:38px;border-radius:11px;object-fit:cover;background:#fff;flex-shrink:0}
.top .sp{flex:1}
.top select{background:var(--pri2);color:var(--onpri);border-color:var(--pri3);min-height:36px;padding:6px 10px;width:auto}
.chip{display:flex;align-items:center;gap:8px;padding:6px 10px;border-radius:99px;background:var(--pri2);font-size:13px;white-space:nowrap}
.chip .dot{width:8px;height:8px;border-radius:50%;background:#888}
.chip .dot.on{background:#5fd18b}
.top .btn{min-height:36px;background:var(--pri2);border-color:var(--pri3);color:var(--onpri)}
.clock{font-size:13px;opacity:.8}
.main{display:flex;flex:1;min-height:0}
nav.side{width:84px;background:#fff;border-right:1px solid var(--line);display:flex;flex-direction:column;padding:8px 6px;gap:4px;flex-shrink:0}
nav.side button{display:flex;flex-direction:column;align-items:center;gap:4px;padding:10px 4px;border-radius:12px;font-size:11px;font-weight:600;color:var(--muted)}
nav.side button svg{width:22px;height:22px}
nav.side button.on{background:var(--acc3);color:var(--pri)}
nav.side button:hover{color:var(--pri)}
.view{flex:1;min-width:0;overflow:auto}
.page{padding:20px;max-width:1300px;margin:0 auto}
.page-h{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:16px}
.page-h h2{font-size:26px;flex:1}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px;box-shadow:var(--shadow)}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:16px;overflow-x:auto}
.tabs button{padding:10px 14px;font-weight:600;color:var(--muted);border-bottom:3px solid transparent;white-space:nowrap}
.tabs button.on{color:var(--pri);border-color:var(--acc)}

table.t{width:100%;border-collapse:collapse;font-size:14px}
table.t th{text-align:left;font-size:11px;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);padding:8px 10px;border-bottom:1px solid var(--line);background:var(--bg);position:sticky;top:0}
table.t td{padding:9px 10px;border-bottom:1px solid var(--line);vertical-align:middle}
table.t tr.click{cursor:pointer}
table.t tr.click:hover td{background:var(--acc3)}
.tbl-wrap{overflow:auto;border:1px solid var(--line);border-radius:12px;background:#fff}
.thumb{width:36px;height:36px;border-radius:8px;object-fit:cover;vertical-align:middle;margin-right:8px;background:var(--acc3)}
.em-s{display:inline-flex;width:36px;height:36px;border-radius:8px;align-items:center;justify-content:center;background:var(--acc3);margin-right:8px;vertical-align:middle;font-size:20px}

/* SELL */
.sell{display:flex;height:100%;min-height:0}
.catalog{flex:1;display:flex;flex-direction:column;min-width:0}
.cat-bar{padding:14px 16px 8px;display:flex;flex-direction:column;gap:10px}
.searchrow{display:flex;gap:8px}
.searchrow input{flex:1}
.cats{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px}
.cats button{padding:8px 14px;border-radius:99px;background:#fff;border:1px solid var(--line);font-weight:600;font-size:13px;white-space:nowrap}
.cats button.on{background:var(--pri);color:var(--onpri);border-color:var(--pri)}
.pgrid{flex:1;overflow:auto;padding:4px 16px 16px;display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px;align-content:start}
.pcard{background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:10px;text-align:left;display:flex;flex-direction:column;gap:6px;position:relative;transition:.12s;min-height:150px}
.pcard:hover{border-color:var(--acc);transform:translateY(-1px);box-shadow:var(--shadow)}
.pcard:active{transform:scale(.98)}
.pcard .em{font-size:34px;line-height:1;height:90px;display:flex;align-items:center;justify-content:center;background:var(--acc3);border-radius:10px;overflow:hidden}
.pcard .em img{width:100%;height:100%;object-fit:cover}
.pcard .nm{font-weight:600;font-size:14px;line-height:1.25;flex:1}
.pcard .gn{font-size:11px;color:var(--muted)}
.pcard .pr{font-weight:700;color:var(--pri)}
.pcard .st{position:absolute;top:6px;right:6px}
.pcard .tag{position:absolute;top:6px;left:6px}
.pcard.out{opacity:.5}
.cart{width:390px;background:#fff;border-left:1px solid var(--line);display:flex;flex-direction:column;flex-shrink:0}
.cart-h{padding:12px 16px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:8px}
.cart-h h3{flex:1;font-size:19px}
.cust{padding:8px 16px;font-size:13px;background:var(--bg);border-bottom:1px solid var(--line);display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.cust .pill{padding:4px 10px;border-radius:99px;background:#fff;border:1px solid var(--line);font-weight:600;font-size:12px}
.cust .pill.set{background:var(--acc3);border-color:var(--acc)}
.lines{flex:1;overflow:auto;padding:6px 10px}
.line{display:flex;align-items:center;gap:8px;padding:10px 6px;border-bottom:1px dashed var(--line)}
.line .info{flex:1;min-width:0}
.line .info .n{font-weight:600;font-size:14px}
.line .info .o{font-size:12px;color:var(--pri3)}
.line .info .p{font-size:12px;color:var(--muted)}
.qty{display:flex;align-items:center;gap:2px;background:var(--bg);border-radius:10px;padding:2px}
.qty button{width:30px;height:30px;border-radius:8px;font-weight:700;font-size:16px}
.qty button:hover{background:#fff}
.qty .q{min-width:30px;text-align:center;font-weight:700;cursor:pointer;font-size:13px}
.line .lt{font-weight:700;min-width:78px;text-align:right}
.line .x{color:var(--muted);padding:4px;font-size:18px}
.empty{padding:40px 20px;text-align:center;color:var(--muted)}
.totals{padding:12px 16px;border-top:1px solid var(--line);font-size:14px}
.totals .r{display:flex;justify-content:space-between;padding:2px 0}
.totals .grand{font-size:24px;font-weight:800;color:var(--pri);padding-top:6px;margin-top:6px;border-top:1px solid var(--line)}
.cart-actions{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;padding:0 16px 10px}
.cart-actions .btn{padding:8px 4px;font-size:12px;min-height:40px}
.paybtn{margin:0 16px 16px;min-height:58px;font-size:18px}
.banner{margin:10px 16px 0;padding:10px 14px;border-radius:12px;background:var(--warnbg);color:var(--warn);font-weight:600;display:flex;gap:10px;align-items:center;font-size:14px;flex-wrap:wrap}
.mcart{display:none}
@media(max-width:900px){
  .cart{position:fixed;left:0;right:0;bottom:0;top:0;width:auto;z-index:40;transform:translateY(100%);transition:transform .25s;border:0}
  .cart.open{transform:none}
  .mcart{display:flex;position:fixed;left:12px;right:12px;bottom:76px;z-index:30;min-height:56px;font-size:16px;box-shadow:0 6px 20px rgba(0,0,0,.25)}
  .pgrid{padding-bottom:150px;grid-template-columns:repeat(auto-fill,minmax(130px,1fr))}
  .pcard .em{height:76px}
}

.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;margin-bottom:16px}
.kpi{background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:14px 16px}
.kpi .l{font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);font-weight:700}
.kpi .v{font-size:24px;font-weight:800;color:var(--pri);margin-top:4px}
.kpi .s{font-size:12px;color:var(--muted)}
.bars{display:flex;align-items:flex-end;gap:6px;height:180px;padding:10px 4px 0;overflow-x:auto}
.bars .b{flex:1;min-width:26px;display:flex;flex-direction:column;align-items:center;gap:4px;height:100%;justify-content:flex-end}
.bars .b i{display:block;width:100%;background:linear-gradient(180deg,var(--acc),var(--pri3));border-radius:6px 6px 2px 2px;min-height:2px}
.bars .b span{font-size:10px;color:var(--muted);white-space:nowrap}
.sec{margin-bottom:16px}
.sec h3{font-size:18px;margin-bottom:10px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:16px}
@media(max-width:900px){.two{grid-template-columns:1fr}}

.ovl{position:fixed;inset:0;background:rgba(15,15,25,.55);z-index:100;display:flex;align-items:center;justify-content:center;padding:16px}
.modal{background:var(--card);border-radius:18px;width:100%;max-width:520px;max-height:92vh;display:flex;flex-direction:column;box-shadow:0 20px 60px rgba(0,0,0,.3)}
.modal.wide{max-width:820px}
.modal-h{padding:16px 20px;border-bottom:1px solid var(--line);display:flex;align-items:center}
.modal-h h3{flex:1;font-size:20px}
.modal-b{padding:16px 20px;overflow:auto}
.modal-f{padding:12px 20px;border-top:1px solid var(--line);display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}
#toasts{position:fixed;top:70px;right:16px;z-index:200;display:flex;flex-direction:column;gap:8px;pointer-events:none}
.toast{background:var(--pri);color:var(--onpri);padding:12px 16px;border-radius:12px;box-shadow:var(--shadow);font-weight:600;max-width:340px;animation:tin .2s}
.toast.bad{background:var(--bad);color:#fff}
@keyframes tin{from{opacity:0;transform:translateY(-8px)}}

.pay-total{text-align:center;padding:8px 0 14px}
.pay-total .l{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;font-weight:700}
.pay-total .v{font-size:40px;font-weight:800;color:var(--pri)}
.methods{display:grid;grid-template-columns:repeat(auto-fit,minmax(78px,1fr));gap:6px}
.methods button,.chips button{padding:10px 8px;border:1px solid var(--line);border-radius:10px;background:#fff;font-weight:600;font-size:13px}
.methods button.on,.chips button.on{background:var(--pri);color:var(--onpri);border-color:var(--pri)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chips button small{display:block;font-weight:500;opacity:.75;font-size:11px}
.quick{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:8px}
.quick button{padding:10px;border-radius:10px;background:var(--acc3);font-weight:700}
.paylist .pl{display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px dashed var(--line);font-size:14px}
.changebox{margin-top:12px;padding:12px;border-radius:12px;background:var(--okbg);color:var(--ok);display:flex;justify-content:space-between;font-weight:800;font-size:20px}
.changebox.due{background:var(--warnbg);color:var(--warn)}
.optgrp{margin-bottom:12px}
.optgrp .gl{font-weight:700;font-size:14px;margin-bottom:6px}

.login{min-height:100vh;min-height:100dvh;display:flex;align-items:center;justify-content:center;padding:20px;background:radial-gradient(circle at 20% 10%,var(--pri3) 0,var(--pri) 50%,#000 140%)}
.login-card{background:var(--card);border-radius:22px;padding:28px;width:100%;max-width:400px;box-shadow:0 30px 80px rgba(0,0,0,.4)}
.login-logo{text-align:center;margin-bottom:18px;display:flex;flex-direction:column;align-items:center}
.login-logo .mono,.login-logo .logo-img{width:72px;height:72px;font-size:36px;border-radius:20px}
.login-logo h1{font-size:26px;margin-top:10px}
.login-logo .s{font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:var(--muted);margin-top:4px}
.pinpad{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}
.pinpad button{height:56px;border-radius:12px;background:#fff;border:1px solid var(--line);font-size:22px;font-weight:700}
.pinpad button:active{background:var(--acc3)}
.pindots{display:flex;justify-content:center;gap:10px;margin:14px 0 4px}
.pindots i{width:14px;height:14px;border-radius:50%;border:2px solid var(--acc);display:block}
.pindots i.f{background:var(--acc)}
.demo-hint{margin-top:14px;font-size:12px;color:var(--muted);text-align:center;line-height:1.5}

.demobar{background:linear-gradient(90deg,var(--acc),var(--acc2));color:var(--onacc);font-size:13px;font-weight:600;padding:7px 14px;display:flex;gap:10px;align-items:center;justify-content:center;flex-wrap:wrap;flex-shrink:0;text-align:center}
.demobar a{color:var(--acc2);background:var(--pri);padding:3px 10px;border-radius:99px;text-decoration:none;font-weight:700}
.demo-logins{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:6px 0 4px}
.demo-logins button{border:2px solid var(--acc);background:var(--acc3);border-radius:12px;padding:10px 4px;font-weight:700;color:var(--pri);line-height:1.2}
.demo-logins button small{display:block;font-weight:600;color:var(--muted);font-size:11px}
/* wizard */
.wz{min-height:100vh;min-height:100dvh;background:var(--bg);display:flex;flex-direction:column}
.wz-top{background:var(--pri);color:var(--onpri);padding:14px 20px;display:flex;align-items:center;gap:12px}
.wz-top h1{color:var(--onpri);font-size:20px;flex:1}
.wz-steps{display:flex;gap:6px}
.wz-steps i{width:28px;height:6px;border-radius:9px;background:var(--pri3);display:block}
.wz-steps i.on{background:var(--acc)}
.wz-body{flex:1;padding:20px;max-width:1100px;margin:0 auto;width:100%}
.wz-body h2{font-size:28px;margin-bottom:6px}
.biz-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:12px;margin-top:16px}
.biz{background:#fff;border:2px solid var(--line);border-radius:16px;padding:14px;text-align:left;display:flex;flex-direction:column;gap:6px;transition:.12s}
.biz:hover{border-color:var(--acc)}
.biz.on{border-color:var(--pri);box-shadow:0 0 0 3px var(--acc3)}
.biz .e{font-size:30px}
.biz .n{font-weight:700;font-size:15px}
.biz .d{font-size:12px;color:var(--muted);line-height:1.35;flex:1}
.biz .sw{display:flex;gap:4px}
.biz .sw i{width:18px;height:18px;border-radius:5px;display:block;border:1px solid rgba(0,0,0,.08)}
.theme-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.th{border:2px solid var(--line);border-radius:14px;overflow:hidden;background:#fff;text-align:left}
.th.on{border-color:var(--pri);box-shadow:0 0 0 3px var(--acc3)}
.th .bar{height:26px}
.th .bd{padding:8px 10px;display:flex;align-items:center;gap:6px}
.th .bd i{width:16px;height:16px;border-radius:50%;display:block}
.th .bd span{font-size:12px;font-weight:600}
.wz-foot{position:sticky;bottom:0;background:#fff;border-top:1px solid var(--line);padding:12px 20px;display:flex;gap:10px;justify-content:flex-end}
.preview{border:1px solid var(--line);border-radius:16px;overflow:hidden;background:var(--bg)}
.preview .ph{background:var(--pri);color:var(--onpri);padding:10px 14px;display:flex;align-items:center;gap:10px;font-family:var(--hfont);font-weight:700}
.preview .pb{padding:14px;display:flex;gap:10px;flex-wrap:wrap;align-items:flex-start}

/* receipt & labels */
.rcpt{font-family:'Courier New',ui-monospace,monospace;font-size:12px;line-height:1.35;background:#fff;color:#000;padding:14px;margin:0 auto;border:1px dashed #ccc}
.rcpt.w80{width:302px}.rcpt.w58{width:220px}
.rcpt .c{text-align:center}.rcpt .b{font-weight:700}
.rcpt .hr{border-top:1px dashed #000;margin:6px 0}
.rcpt .r{display:flex;justify-content:space-between;gap:6px}
.rcpt .big{font-size:15px;font-weight:700}
.rcpt .huge{font-size:28px;font-weight:700;text-align:center}
.rcpt .demo{border:1px solid #000;padding:4px;text-align:center;font-weight:700;margin:6px 0}
.rcpt .o{padding-left:10px;font-size:11px}
.rcpt img.rl{display:block;margin:0 auto 6px;max-width:70px;max-height:70px;filter:grayscale(1)}
.labels{display:flex;flex-wrap:wrap;gap:4mm;background:#fff;padding:4mm}
.lbl{border:1px dashed #bbb;color:#000;background:#fff;padding:1.5mm 2mm;display:flex;flex-direction:column;justify-content:space-between;font-family:Arial,sans-serif;overflow:hidden}
.lbl.s{width:38mm;height:25mm}.lbl.m{width:50mm;height:30mm}.lbl.l{width:62mm;height:40mm}
.lbl .ln{font-size:8pt;font-weight:700;line-height:1.1;max-height:2.3em;overflow:hidden}
.lbl .lp{font-size:10pt;font-weight:800}
.lbl.l .ln{font-size:10pt}.lbl.l .lp{font-size:13pt}
.lbl svg{display:block;width:100%}
.lbl .lc{font-size:6.5pt;text-align:center;letter-spacing:.08em}
#printArea{display:none}
@media print{
  body *{visibility:hidden}
  #printArea,#printArea *{visibility:visible}
  #printArea{display:block;position:absolute;left:0;top:0}

// ---------- SHA-256 (PIN hashing) ----------
function sha256(ascii){function rr(v,a){return(v>>>a)|(v<<(32-a))}var mp=Math.pow,mw=mp(2,32),i,j,res='';var words=[],abl=ascii.length*8;var hash=[],k=[],pc=0;var isC={};for(var c=2;pc<64;c++){if(!isC[c]){for(i=0;i<313;i+=c){isC[i]=c}hash[pc]=(mp(c,.5)*mw)|0;k[pc++]=(mp(c,1/3)*mw)|0}}hash=hash.slice(0,8);ascii+='\x80';while(ascii.length%64-56)ascii+='\x00';for(i=0;i<ascii.length;i++){j=ascii.charCodeAt(i);if(j>>8)return'';words[i>>2]|=j<<((3-i)%4)*8}words[words.length]=((abl/mw)|0);words[words.length]=(abl);for(j=0;j<words.length;){var w=words.slice(j,j+=16);var oh=hash;hash=hash.slice(0,8);for(i=0;i<64;i++){var w15=w[i-15],w2=w[i-2];var a=hash[0],e=hash[4];var t1=hash[7]+(rr(e,6)^rr(e,11)^rr(e,25))+((e&hash[5])^((~e)&hash[6]))+k[i]+(w[i]=(i<16)?w[i]:(w[i-16]+(rr(w15,7)^rr(w15,18)^(w15>>>3))+w[i-7]+(rr(w2,17)^rr(w2,19)^(w2>>>10)))|0);var t2=(rr(a,2)^rr(a,13)^rr(a,22))+((a&hash[1])^(a&hash[2])^(hash[1]&hash[2]));hash=[(t1+t2)|0].concat(hash);hash[4]=(hash[4]+t1)|0}for(i=0;i<8;i++){hash[i]=(hash[i]+oh[i])|0}}for(i=0;i<8;i++){for(j=3;j+1;j--){var b=(hash[i]>>(j*8))&255;res+=((b<16)?0:'')+b.toString(16)}}return res}

function rgb2hex(r){return'#'+r.map(v=>pad(Math.max(0,Math.min(255,Math.round(v))).toString(16))).join('')}

const C128='212222 222122 222221 121223 121322 131222 122213 122312 132212 221213 221312 231212 112232 122132 122231 113222 123122 123221 223211 221132 221231 213212 223112 312131 311222 321122 321221 312212 322112 322211 212123 212321 232121 111323 131123 131321 112313 132113 132311 211313 231113 231311 112133 112331 132131 113123 113321 133121 313121 211331 231131 213113 213311 213131 311123 311321 331121 312113 312311 332111 314111 221411 431111 111224 111422 121124 121421 141122 141221 112214 112412 122114 122411 142112 142211 241211 221114 413111 241112 134111 111242 121142 121241 114212 124112 124211 411212 421112 421211 212141 214121 412121 111143 111341 131141 114113 114311 411113 411311 113141 114131 311141 411131 211412 211214 211232 2331112'.split(' ');
function code128svg(text,h=40){
  text=String(text||'').replace(/[^\x20-\x7e]/g,'');
  const codes=[104];for(const ch of text)codes.push(ch.charCodeAt(0)-32);
  let sum=104;for(let i=1;i<codes.length;i++)sum+=codes[i]*i;
  codes.push(sum%103,106);
  let x=10,rects='';
  codes.forEach(c=>{const p=C128[c];for(let i=0;i<p.length;i++){const w=+p[i];if(i%2===0)rects+=`<rect x="${x}" y="0" width="${w}" height="${h}"/>`;x+=w}});
  x+=10;
  return `<svg viewBox="0 0 ${x} ${h}" height="${h}" preserveAspectRatio="none" shape-rendering="crispEdges" xmlns="http://www.w3.org/2000/svg"><rect width="${x}" height="${h}" fill="#fff"/><g fill="#000">${rects}</g></svg>`;
}
function eanCheck(d12){let s=0;for(let i=0;i<12;i++)s+=(+d12[i])*(i%2?3:1);return(10-s%10)%10}
function genBarcode(){let d;do{d='200'+String(Math.floor(Math.random()*1e9)).padStart(9,'0');d+=eanCheck(d)}while(DB.products.some(p=>p.barcode===d));return d}

const KEY=PRESET&&PRESET.id?'setupgo_pos_'+PRESET.id:'setupgo_pos_v2';let DB=null,STORE='idb',SAVE_T=null;
const IDB={db:null,
  open(){return new Promise((res,rej)=>{try{const r=indexedDB.open('setupgo_pos',1);r.onupgradeneeded=()=>r.result.createObjectStore('kv');r.onsuccess=()=>{this.db=r.result;res()};r.onerror=()=>rej(r.error)}catch(e){rej(e)}})},
  get(k){return new Promise((res,rej)=>{const q=this.db.transaction('kv').objectStore('kv').get(k);q.onsuccess=()=>res(q.result);q.onerror=()=>rej(q.error)})},
  set(k,v){return new Promise((res,rej)=>{const tx=this.db.transaction('kv','readwrite');tx.objectStore('kv').put(v,k);tx.oncomplete=()=>res();tx.onerror=()=>rej(tx.error)})},
  del(k){return new Promise(res=>{const tx=this.db.transaction('kv','readwrite');tx.objectStore('kv').delete(k);tx.oncomplete=()=>res();tx.onerror=()=>res()})}};

  catch(e){STORE='ls';try{const s=localStorage.getItem(KEY);DB=s?JSON.parse(s):null}catch(x){STORE='mem';DB=null}}
}
function flush(){
  clearTimeout(SAVE_T);SAVE_T=null;if(!DB)return;const s=JSON.stringify(DB);
  if(STORE==='idb')IDB.set(KEY,s).catch(()=>{STORE='ls';flush()});
  else if(STORE==='ls'){try{localStorage.setItem(KEY,s)}catch(e){STORE='mem';toast('Storage is full or unavailable — export a backup now.',true)}}
}

async function cameraScan(onCode){
  modal('Scan barcode',`<video id="camV" playsinline muted autoplay style="width:100%;border-radius:12px;background:#000;max-height:55vh"></video><p class="muted" id="camMsg">Starting camera… point it at the barcode.</p>`,[{label:'Type code instead',on:()=>{closeModal();modal('Enter barcode',`<input type="text" id="mCode" inputmode="numeric" autocomplete="off">`,[{label:'Cancel',on:closeModal},{label:'OK',cls:'primary',on:()=>{const c=val('mCode');closeModal();if(c)onCode(c)}}])}},{label:'Cancel',on:closeModal}],{nofocus:true});
  const msg=t=>{const m=$('#camMsg');if(m)m.textContent=t};
  const done=code=>{if(!$('#camV'))return;stopCam();try{navigator.vibrate&&navigator.vibrate(80)}catch(e){}closeModal();onCode(String(code).trim())};
  if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia){msg('Camera is not available in this browser or preview. Use a USB/Bluetooth scanner, or open the app from your own website (https).');return}
  try{
    if('BarcodeDetector' in window){
      CAM.stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:'environment'}},audio:false});
      const v=$('#camV');if(!v)return stopCam();v.srcObject=CAM.stream;await v.play();
      const det=new BarcodeDetector();msg('Point the camera at the barcode…');
      CAM.timer=setInterval(async()=>{try{const r=await det.detect(v);if(r&&r.length)done(r[0].rawValue)}catch(e){}},250);
    }else{
      msg('Loading scanner…');
      await loadScript('https://unpkg.com/@zxing/library@0.21.3/umd/index.min.js');
      if(!$('#camV'))return;
      CAM.reader=new ZXing.BrowserMultiFormatReader();msg('Point the camera at the barcode…');
      CAM.reader.decodeFromConstraints({video:{facingMode:{ideal:'environment'}}},'camV',(res)=>{if(res)done(res.getText())});
    }
  }catch(e){msg('Could not open the camera ('+(e.message||e.name||'blocked')+'). Allow camera access, use https, or use a USB/Bluetooth scanner.')}
}

function calc(cart){
  const st=ST();const rate=(st.vatReg?st.vatRate:0)/100;
  let gross=0,vatableGross=0,exemptGross=0;
  cart.lines.forEach(l=>{const t=r2(l.qty*l.price);gross+=t;if(l.vatable&&st.vatReg)vatableGross+=t;else exemptGross+=t});
  gross=r2(gross);
  let res={gross,discount:0,lessVat:0,vatable:0,vat:0,exempt:0,zero:0,total:gross};
  if(cart.discType==='senior'||cart.discType==='pwd'){
    const base=r2(vatableGross/(1+rate)+exemptGross);const disc=r2(base*st.scRate/100);
    res.lessVat=r2(vatableGross-vatableGross/(1+rate));res.exempt=base;res.discount=disc;res.total=r2(base-disc);
  }else{
    let disc=0;
    if(cart.discType==='pct')disc=r2(gross*Math.min(100,cart.discVal)/100);
    if(cart.discType==='amt')disc=Math.min(gross,r2(cart.discVal));
    const f=gross?(gross-disc)/gross:0;const vg=vatableGross*f;
    res.discount=disc;res.vatable=r2(vg/(1+rate));res.vat=r2(vg-res.vatable);res.exempt=r2(exemptGross*f);res.total=r2(gross-disc);
  }
  return res;
}

function addToCart(pid){
  const p=prodById(pid);if(!p||!p.active)return;
  if(F().expiry&&p.expiry&&daysTo(p.expiry)<0)return toast(`${p.name} is EXPIRED (${p.expiry}). Pull it from the shelf.`,true);
  if(F().rx&&p.rx&&!S.cart.rx)return rxModal(()=>addToCart(pid));
  if(p.openPrice)return openPriceModal(p);
  if(p.options&&p.options.length)return optionsModal(p);
  if(p.measured)return measureModal(p,0,'');
  pushLine(p,'',0,1);
}
function lineStockOK(p,extra,skipIdx){
  if(!p.track||ST().allowNeg)return true;
  const inCart=S.cart.lines.reduce((a,l,i)=>a+(l.pid===p.id&&i!==skipIdx?l.qty:0),0);
  if(inCart+extra>stockOf(S.branchId,p.id)+1e-9){toast(`Not enough stock: ${fq(stockOf(S.branchId,p.id),p.unit)} on hand`,true);return false}
  return true;
}
function pushLine(p,opts,delta,qty){
  if(!lineStockOK(p,qty))return false;
  const key=p.id+'|'+opts;const line=S.cart.lines.find(l=>l.key===key);
  if(line)line.qty=r3(line.qty+qty);
  else S.cart.lines.push({key,pid:p.id,name:p.name,opts,price:r2(p.price+delta),qty:r3(qty),vatable:p.vatable,cost:p.cost,unit:p.unit||'',measured:!!p.measured});
  renderCart();renderGrid();return true;
}
function measureModal(p,delta,opts){

let PAY=null;
function payModal(){PAY={total:calc(S.cart).total,payments:[],method:METHODS()[0]};drawPay()}
function payState(){const paid=r2(PAY.payments.reduce((a,p)=>a+p.amount,0));return{paid,rem:r2(PAY.total-paid)}}
function drawPay(){
  const {rem}=payState();const isCash=PAY.method==='Cash';const r=Math.max(rem,0);
  const quick=isCash?[r,...[100,200,500,1000].map(b=>Math.ceil(r/b)*b)].filter((v,i,a)=>v>0&&a.indexOf(v)===i).slice(0,4):[];
  const done=rem<=0;
  modal('Payment',`
   <div class="pay-total"><div class="l">Amount due</div><div class="v num">${peso(PAY.total)}</div></div>
   ${PAY.payments.length?`<div class="paylist">${PAY.payments.map((p,i)=>`<div class="pl"><span>${esc(p.method)}${p.ref?' · '+esc(p.ref):''}</span><span class="num">${peso(p.amount)} <button class="btn ghost sm" data-act="payRm" data-i="${i}">✕</button></span></div>`).join('')}</div>`:''}
   ${!done?`<label>Method</label>
   <div class="methods">${METHODS().map(m=>`<button class="${PAY.method===m?'on':''}" data-act="payMethod" data-m="${esc(m)}">${esc(m)}</button>`).join('')}</div>
   <div class="grid2"><div><label for="payAmt">${isCash?'Cash received':'Amount'}</label><input type="number" id="payAmt" step="0.01" min="0" value="${isCash?'':r.toFixed(2)}" inputmode="decimal"></div>
   ${isCash?'':`<div><label for="payRef">Reference no.</label><input type="text" id="payRef" placeholder="Ref / approval no."></div>`}</div>
   ${quick.length?`<div class="quick">${quick.map(q=>`<button data-act="payQuick" data-v="${q}">${peso(q).replace('.00','')}</button>`).join('')}</div>`:''}
   <button class="btn block" style="margin-top:10px" data-act="payAdd">Add ${esc(PAY.method)} payment</button>`:''}
   <div class="changebox ${done?'':'due'}"><span>${done?'Change':'Remaining'}</span><span class="num">${peso(Math.abs(rem))}</span></div>`,
   [{label:'Cancel',on:()=>{PAY=null;closeModal()}},{label:'Complete sale',cls:'gold',id:'payDone',on:completeSale}]);
  $('#payDone').disabled=!done;
  const a=$('#payAmt');if(a)a.addEventListener('keydown',e=>{if(e.key==='Enter')addPayment()});
}
function addPayment(amt){
  const {rem}=payState();
  const a=r2(amt!=null?amt:num('payAmt'));if(a<=0)return toast('Enter an amount',true);
  if(PAY.method!=='Cash'&&a>rem+0.001)return toast('Non-cash payment cannot exceed the remaining amount',true);
  const ref=PAY.method==='Cash'?'':val('payRef');
  if(PAY.method!=='Cash'&&!ref)return toast('Enter the reference number',true);
  PAY.payments.push({method:PAY.method,amount:a,ref});drawPay();
}
function nextOrderNo(bid){const d=today();const s=DB.orderSeq[bid];if(!s||s.day!==d)DB.orderSeq[bid]={day:d,n:0};return ++DB.orderSeq[bid].n}
function completeSale(){
  const {paid,rem}=payState();if(rem>0)return;
  const sh=openShift();if(!sh)return toast('No open shift',true);
  const c=S.cart;const t=calc(c);const b=curBranch();
  const invNo=b.invPrefix+'-'+pad(b.nextInv,8);b.nextInv++;
  const sale={id:uid('s'),invNo,orderNo:F().orderNo?nextOrderNo(b.id):null,branchId:b.id,shiftId:sh.id,userId:S.user.id,ts:Date.now(),
    lines:c.lines.map(l=>({pid:l.pid,name:l.name,opts:l.opts||'',qty:l.qty,price:l.price,cost:l.cost||0,vatable:l.vatable,unit:l.unit||'',measured:!!l.measured})),
    discType:c.discType,discVal:c.discVal,sc:c.sc,customer:c.customer,note:c.note,orderType:c.orderType||'',table:c.table||'',orderName:c.orderName||'',attendant:c.attendant||'',rx:c.rx||null,
    gross:t.gross,discount:t.discount,lessVat:t.lessVat,vatable:t.vatable,vat:t.vat,exempt:t.exempt,zero:t.zero,total:t.total,
    payments:PAY.payments,paid,change:r2(paid-t.total),status:'paid',reprints:0};
  sale.lines.forEach(l=>{const p=prodById(l.pid);if(p&&p.track){setStock(b.id,l.pid,stockOf(b.id,l.pid)-l.qty);move(b.id,l.pid,-l.qty,'sale',invNo)}});
  DB.sales.push(sale);S.cart=newCart();PAY=null;save();
  closeModal();renderCart();renderGrid();showReceipt(sale,true);
}

function showReceipt(s,fresh){
  const btns=[];
  if(!fresh&&s.status==='paid'&&S.view==='sales')btns.push({label:'Void',cls:'danger',on:()=>voidSale(s)});
  if(F().kitchen)btns.push({label:'Kitchen ticket',on:()=>printHTML(kitchenHTML(s))});
  btns.push({label:'Print',cls:'primary',on:()=>printReceipt(s,!fresh)});
  btns.push({label:fresh?'New sale':'Close',cls:fresh?'gold':'',on:closeModal});
  modal(fresh?`✅ Sale complete · Change ${peso(s.change)}`:'Invoice '+esc(s.invNo),receiptHTML(s,!fresh),btns,{nofocus:true});
}

function voidSale(s){
  requireManager('void invoice '+s.invNo,mgr=>{
    modal('Void '+esc(s.invNo),`<p>This reverses the sale and returns stock. The invoice number stays in the series, marked VOID.</p><label for="vReason">Reason</label><input type="text" id="vReason" placeholder="e.g. Wrong item, customer cancelled">`,
    [{label:'Cancel',on:closeModal},{label:'Void sale',cls:'danger',on:()=>{
      const reason=val('vReason');if(!reason)return toast('Reason is required',true);
      s.status='void';s.voidTs=Date.now();s.voidBy=mgr.id;s.voidReason=reason;s.voidShiftId=(openShift()||{}).id||null;
      s.lines.forEach(l=>{const p=prodById(l.pid);if(p&&p.track){setStock(s.branchId,l.pid,stockOf(s.branchId,l.pid)+l.qty);move(s.branchId,l.pid,l.qty,'void',s.invNo,reason)}});
      audit('void',`${s.invNo} ${peso(s.total)} — ${reason} (approved by ${mgr.username})`);save();closeModal();toast('Sale voided');renderView()}}]);
  });
}

// ---------- SHIFT ----------
function shiftCalc(sh){
  const sales=DB.sales.filter(s=>s.shiftId===sh.id);const paid=sales.filter(s=>s.status==='paid');
  const voidedLater=DB.sales.filter(s=>s.status==='void'&&s.voidShiftId===sh.id&&s.shiftId!==sh.id);
  const byMethod={};METHODS().forEach(m=>byMethod[m]=0);
  paid.forEach(s=>s.payments.forEach(p=>byMethod[p.method]=(byMethod[p.method]||0)+p.amount));
  const change=paid.reduce((a,s)=>a+s.change,0);const cashSales=r2((byMethod.Cash||0)-change);
  const cashRefund=voidedLater.reduce((a,s)=>a+(s.payments.filter(p=>p.method==='Cash').reduce((x,p)=>x+p.amount,0)-s.change),0);
  const cin=(sh.cashMoves||[]).filter(m=>m.type==='in').reduce((a,m)=>a+m.amount,0);
  const cout=(sh.cashMoves||[]).filter(m=>m.type==='out').reduce((a,m)=>a+m.amount,0);
  return{count:paid.length,voids:sales.length-paid.length,total:r2(paid.reduce((a,s)=>a+s.total,0)),byMethod,cashSales,cin,cout,cashRefund:r2(cashRefund),expected:r2(sh.openCash+cashSales+cin-cout-cashRefund),discount:r2(paid.reduce((a,s)=>a+s.discount,0))};
}

  let body='';

    body=`<div class="card sec" style="max-width:480px"><h3>Open shift</h3><p class="muted">Count the cash in the drawer before you start.</p>
     <label for="openCash">Opening cash (₱)</label><input type="number" id="openCash" min="0" step="0.01" inputmode="decimal" placeholder="e.g. 2000">
     <button class="btn primary block" style="margin-top:14px" data-act="openShift">Open shift</button></div>`;

    <div class="two"><div class="card"><h3 style="margin-bottom:8px">Payments</h3>
      <table class="t">${Object.keys(c.byMethod).map(m=>`<tr><td>${esc(m)}</td><td class="right num">${peso(m==='Cash'?c.cashSales:c.byMethod[m])}</td></tr>`).join('')}<tr><td>Cash in</td><td class="right num">${peso(c.cin)}</td></tr><tr><td>Cash out</td><td class="right num">${peso(c.cout)}</td></tr>${c.cashRefund?`<tr><td>Cash refunds (voids)</td><td class="right num">${peso(c.cashRefund)}</td></tr>`:''}</table>
      <div class="row" style="margin-top:12px"><button class="btn" data-act="cashMove" data-t="in">+ Cash in</button><button class="btn" data-act="cashMove" data-t="out">− Cash out</button><button class="btn" data-act="xread">Print X-reading</button></div></div>
     <div class="card"><h3>Close shift</h3><p class="muted">Count all cash in the drawer, then enter the total.</p>
      <div class="grid3">${[1000,500,200,100,50,20,10,5,1].map(d=>`<div><label for="dn${d}">₱${d} ×</label><input type="number" min="0" id="dn${d}" data-on="denom" inputmode="numeric"></div>`).join('')}<div><label for="dnC">Coins (₱)</label><input type="number" min="0" step="0.01" id="dnC" data-on="denom" inputmode="decimal"></div></div>
      <label for="countCash">Counted cash (₱)</label><input type="number" id="countCash" min="0" step="0.01" inputmode="decimal">
      <button class="btn danger block" style="margin-top:14px" data-act="closeShift">Close shift</button></div></div>`;
  }
  $('#view').innerHTML=`<div class="page"><div class="page-h"><h2>My Shift</h2><span class="badge b-gold">${esc(curBranch().name)}</span></div>
   ${others.length&&S.user.role!=='cashier'?`<div class="banner" style="margin:0 0 14px">Other open shifts here: ${others.map(o=>esc((userById(o.userId)||{}).name)).join(', ')}</div>`:''}${body}
   <div class="sec" style="margin-top:20px"><h3>Shift history</h3><div class="tbl-wrap"><table class="t"><thead><tr><th>Cashier</th><th>Opened</th><th>Closed</th><th class="right">Sales</th><th class="right">Expected</th><th class="right">Counted</th><th class="right">Over / short</th></tr></thead><tbody>
   ${hist.length?hist.map(h=>{const c=shiftCalc(h);return `<tr class="click" data-act="shiftRpt" data-id="${h.id}"><td>${esc((userById(h.userId)||{}).name||'')}</td><td>${fdt(h.openTs)}</td><td>${h.closeTs?fdt(h.closeTs):'<span class="badge b-ok">Open</span>'}</td><td class="right num">${peso(c.total)}</td><td class="right num">${h.status==='closed'?peso(h.expected):'—'}</td><td class="right num">${h.status==='closed'?peso(h.counted):'—'}</td><td class="right num">${h.status==='closed'?`<span class="badge ${Math.abs(h.variance)<0.01?'b-ok':h.variance<0?'b-bad':'b-warn'}">${h.variance>0?'+':''}${peso(h.variance)}</span>`:'—'}</td></tr>`}).join(''):'<tr><td colspan="7" class="empty">No shifts yet.</td></tr>'}</tbody></table></div></div></div>`;

// ---------- INVENTORY ----------
function renderInventory(){
  $('#view').style.overflow='auto';
  const tab=S.tab.inv||'stock';const bid=S.branchId;const fx=F().expiry;let body='';
  if(tab==='stock'){
    const q=(S.tab.invQ||'').toLowerCase();
    const list=DB.products.filter(p=>p.track&&p.active&&(!q||p.name.toLowerCase().includes(q)||p.sku.toLowerCase().includes(q)||(p.barcode||'').includes(q)));
    const low=list.filter(p=>stockOf(bid,p.id)<=p.lowAt);
    const expSoon=fx?list.filter(p=>p.expiry&&daysTo(p.expiry)<=60):[];
    const value=list.reduce((a,p)=>a+Math.max(0,stockOf(bid,p.id))*p.cost,0);
    body=`<div class="kpis"><div class="kpi"><div class="l">Tracked items</div><div class="v">${list.length}</div></div><div class="kpi"><div class="l">Low / out of stock</div><div class="v" style="color:${low.length?'var(--bad)':'var(--ok)'}">${low.length}</div></div>${fx?`<div class="kpi"><div class="l">Expiring ≤ 60 days</div><div class="v" style="color:${expSoon.length?'var(--warn)':'var(--ok)'}">${expSoon.length}</div></div>`:''}<div class="kpi"><div class="l">Stock value (cost)</div><div class="v num">${peso(value)}</div></div></div>
     <div class="row sec"><input type="search" id="invQ" placeholder="Search or scan…" value="${esc(S.tab.invQ||'')}" data-on="invQ" style="flex:1;min-width:180px"><button class="btn primary" data-act="receive">+ Receive stock</button>${DB.branches.filter(b=>b.active).length>1?'<button class="btn" data-act="transfer">Transfer</button>':''}<button class="btn" data-act="exportStock">Export CSV</button></div>
     <div class="tbl-wrap"><table class="t"><thead><tr><th>Product</th><th>Category</th><th class="right">On hand</th><th class="right">Low at</th>${fx?'<th>Expiry / lot</th>':''}<th>Status</th><th></th></tr></thead><tbody>
     ${list.map(p=>{const s=stockOf(bid,p.id);const d=p.expiry?daysTo(p.expiry):null;return `<tr><td>${prodThumb(p)}<b>${esc(p.name)}</b><div class="muted small">${esc(p.sku)}${p.barcode?' · '+esc(p.barcode):''}</div></td><td>${esc(p.cat)}</td><td class="right num"><b>${fq(s,p.unit)}</b></td><td class="right">${fq(p.lowAt)}</td>${fx?`<td>${p.expiry?`<span class="badge ${d<0?'b-bad':d<=60?'b-warn':'b-ok'}">${esc(p.expiry)}</span> <span class="muted small">${esc(p.lot||'')}</span>`:'<span class="muted">—</span>'}</td>`:''}<td>${s<=0?'<span class="badge b-bad">Out</span>':s<=p.lowAt?'<span class="badge b-warn">Low</span>':'<span class="badge b-ok">OK</span>'}</td><td class="right"><button class="btn sm" data-act="adjust" data-id="${p.id}">Adjust</button></td></tr>`}).join('')||'<tr><td colspan="7" class="empty">No tracked products.</td></tr>'}</tbody></table></div>`;
  }else if(tab==='insights'){
    body=insightsHTML();
  }else if(tab==='moves'){
    const list=DB.moves.filter(m=>m.branchId===bid).slice(0,300);
    body=`<div class="tbl-wrap"><table class="t"><thead><tr><th>When</th><th>Product</th><th>Type</th><th class="right">Qty</th><th class="right">After</th><th>Ref / note</th><th>By</th></tr></thead><tbody>
     ${list.length?list.map(m=>{const p=prodById(m.productId)||{name:'(deleted)'};return `<tr><td>${fdt(m.ts)}</td><td>${esc(p.name)}</td><td><span class="badge ${m.qty>0?'b-ok':'b-warn'}">${esc(m.type)}</span></td><td class="right num">${m.qty>0?'+':''}${fq(m.qty)}</td><td class="right num">${fq(m.after)}</td><td>${esc(m.ref)} ${esc(m.note)}</td><td>${esc((userById(m.userId)||{}).name||'')}</td></tr>`}).join(''):'<tr><td colspan="7" class="empty">No stock movements yet.</td></tr>'}</tbody></table></div>`;
  }else{
    const q=(S.tab.prodQ||'').toLowerCase();
    const list=DB.products.filter(p=>!q||p.name.toLowerCase().includes(q)||p.sku.toLowerCase().includes(q)||(p.barcode||'').includes(q));
    body=`<div class="row sec"><input type="search" id="prodQ" placeholder="Search or scan…" value="${esc(S.tab.prodQ||'')}" data-on="prodQ" style="flex:1;min-width:180px"><button class="btn primary" data-act="editProd" data-id="">+ New product</button><button class="btn" data-act="bulkPhotos">Upload photos</button><button class="btn" data-act="labels">Print barcode labels</button><button class="btn" data-act="genAllBarcodes">Create missing barcodes</button><button class="btn" data-act="editCats">Categories</button></div>

     ${list.map(p=>`<tr class="click" data-act="editProd" data-id="${p.id}"><td>${prodThumb(p)}<b>${esc(p.name)}</b><div class="muted small">${esc(p.sku)}${p.options&&p.options.length?' · '+p.options.length+' option group'+(p.options.length>1?'s':''):''}</div></td><td class="small">${p.barcode?esc(p.barcode):'<span class="muted">—</span>'}</td><td>${esc(p.cat)}</td><td class="right num">${p.openPrice?'Open':peso(p.price)}${p.unit?'<span class="muted small"> /'+esc(p.unit)+'</span>':''}</td><td class="right num">${peso(p.cost)}</td><td class="right">${p.price?Math.round((p.price-p.cost)/p.price*100)+'%':'—'}</td><td class="small">${[p.track?'Stock':'Service',p.measured?'Measured':'',p.rx?'Rx':'',p.vatable?'':'VAT-exempt'].filter(Boolean).join(' · ')}</td><td>${p.active?'<span class="badge b-ok">Active</span>':'<span class="badge b-bad">Hidden</span>'}</td></tr>`).join('')||'<tr><td colspan="8" class="empty">No products yet.</td></tr>'}</tbody></table></div>
     <p class="muted small">Tip: to upload many photos at once, name each photo after the product's SKU, barcode or exact name (e.g. <b>ES01.jpg</b>).</p>`;
  }
  $('#view').innerHTML=`<div class="page"><div class="page-h"><h2>Inventory</h2><span class="badge b-gold">${esc(curBranch().name)}</span></div>
   <div class="tabs">${[['stock','Stock levels'],['insights','Alerts & planning'],['moves','Movements'],['products','Products']].map(([k,l])=>`<button class="${tab===k?'on':''}" data-act="invTab" data-k="${k}">${l}</button>`).join('')}</div>${body}</div>`;
}

function transferModal(){
  const others=DB.branches.filter(b=>b.active&&b.id!==S.branchId);
  modal('Transfer stock from '+esc(curBranch().name),`<label for="tfP">Product</label><select id="tfP">${prodOptions()}</select>
   <div class="grid2"><div><label for="tfQ">Quantity</label><input type="number" id="tfQ" min="0" step="0.001" inputmode="decimal"></div><div><label for="tfTo">To branch</label><select id="tfTo">${others.map(b=>`<option value="${b.id}">${esc(b.name)}</option>`).join('')}</select></div></div>`,
   [{label:'Cancel',on:closeModal},{label:'Transfer',cls:'primary',on:()=>{const pid=val('tfP'),q=r3(num('tfQ')),to=val('tfTo');if(q<=0)return toast('Enter quantity',true);if(q>stockOf(S.branchId,pid)&&!ST().allowNeg)return toast('Not enough stock',true);
     const ref='TRF-'+Date.now().toString(36).toUpperCase();
     setStock(S.branchId,pid,stockOf(S.branchId,pid)-q);move(S.branchId,pid,-q,'transfer out',ref,'to '+branchById(to).name);
     setStock(to,pid,stockOf(to,pid)+q);move(to,pid,q,'transfer in',ref,'from '+curBranch().name);
     audit('transfer',`${prodById(pid).name} x${q} → ${branchById(to).name}`);save();closeModal();toast('Transferred');renderInventory()}}]);
}

  try{if(window.claude&&typeof window.claude.use==='function'){const dl=await Promise.race([window.claude.use('downloads'),new Promise(r=>setTimeout(()=>r(null),4000))]);
    if(dl){try{await dl.save({filename:name,data:blob});toast('Saved '+name);return}catch(e){if(e&&(e.code==='declined'||e.code==='rate_limited'))return;}}}}catch(e){}
  try{const a=document.createElement('a');const u=URL.createObjectURL(blob);a.href=u;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),5000);toast('Downloading '+name)}catch(e){toast('Downloads are blocked here. Open the app from your website or file.',true)}
}

const fdate=k=>new Date(k+'T12:00:00').toLocaleDateString('en-PH',{year:'numeric',month:'short',day:'numeric'});
function periodLabel(f){const [a,b]=repRange(f);const d=new Date(a+'T12:00:00');

function reportData(from,to,bid){
  const a=dstart(from),z=dend(to);
  const all=DB.sales.filter(s=>s.ts>=a&&s.ts<=z&&(bid==='all'||s.branchId===bid)).sort((x,y)=>x.ts-y.ts);
  const sales=all.filter(s=>s.status==='paid'),voids=all.filter(s=>s.status==='void');

  if(R.gran==='day')for(let d=from;d<=to;d=addDays(d,1))R.buckets[d]={n:0,gross:0,disc:0,net:0,vat:0};

  if(R.gran==='hour')for(let h=0;h<24;h++)R.buckets[pad(h)+':00']={n:0,gross:0,disc:0,net:0,vat:0};
  sales.forEach(s=>{
    const k2=s.gross?s.total/s.gross:0;
    s.lines.forEach(l=>{const amt=l.qty*l.price*k2,p=prodById(l.pid);const o=R.byP[l.pid]||(R.byP[l.pid]={name:p?p.name:l.name,cat:p?p.cat:'Other',unit:l.measured?l.unit:'',qty:0,sales:0,cost:0});o.qty+=l.qty;o.sales+=amt;o.cost+=l.qty*(l.cost||0);R.cogs+=l.qty*(l.cost||0);const c=p?p.cat:'Other';R.byCat[c]=(R.byCat[c]||0)+amt});
    s.payments.forEach(p=>R.byPay[p.method]=(R.byPay[p.method]||0)+p.amount);if(s.change)R.byPay.Cash=(R.byPay.Cash||0)-s.change;

    const B=R.buckets[bk];if(B){B.n++;B.gross+=s.gross;B.disc+=s.discount;B.net+=s.total;B.vat+=s.vat}});

  const oldGT=r2(bs.filter(s=>s.ts<a&&s.status==='paid').reduce((x,s)=>x+s.total,0));
  const sum=(arr,k)=>r2(arr.reduce((x,s)=>x+s[k],0));
  const sc=paid.filter(s=>s.discType==='senior'),pwd=paid.filter(s=>s.discType==='pwd'),reg=paid.filter(s=>s.discType==='pct'||s.discType==='amt');
  const pay={};paid.forEach(s=>{s.payments.forEach(p=>pay[p.method]=(pay[p.method]||0)+p.amount);if(s.change)pay.Cash=(pay.Cash||0)-s.change});
  const net=sum(paid,'total');
  return `<div class="rcpt ${RW()}"><div class="c b big">${esc(st.tradeName)}</div>${st.regName&&st.regName!==st.tradeName?`<div class="c">${esc(st.regName)}</div>`:''}<div class="c">${esc(b.address)}</div><div class="c">${st.vatReg?'VAT REG TIN':'TIN'}: ${esc(st.tin)}</div>${st.min?`<div class="c">MIN: ${esc(st.min)}</div>`:''}
   <div class="hr"></div><div class="c b big">Z-READING</div>${RR('Report date',day)}${RR('Printed',fdt(Date.now()))}${RR('Branch',esc(b.name))}
   <div class="hr"></div>${RR('Beg. Invoice',daySales[0]?daySales[0].invNo:'—')}${RR('End. Invoice',daySales.length?daySales[daySales.length-1].invNo:'—')}${RR('Transactions',paid.length)}
   <div class="hr"></div>${RR('Gross sales',P(sum(daySales,'gross')))}${RR('Less: Voids',P(sum(voids,'gross')))}${RR('Less: SC discount',P(sum(sc,'discount')))}${RR('Less: PWD discount',P(sum(pwd,'discount')))}${RR('Less: Reg. discount',P(sum(reg,'discount')))}${RR('Less: VAT adj. (SC/PWD)',P(sum(paid,'lessVat')))}${RR('NET SALES',P(net),'b')}
   <div class="hr"></div>${RR('VATable sales',P(sum(paid,'vatable')))}${RR('VAT amount',P(sum(paid,'vat')))}${RR('VAT-exempt sales',P(sum(paid,'exempt')))}${RR('Zero-rated sales',P(0))}
   <div class="hr"></div>${Object.entries(pay).map(([m,v])=>RR(esc(m),P(v))).join('')||RR('Payments','0.00')}
   <div class="hr"></div>${RR('Old grand total',P(oldGT))}${RR('New grand total',P(oldGT+net),'b')}
   ${st.ptu?'':'<div class="demo">TRAINING MODE</div>'}</div>`;
}

  cashMove:t=>{const ty=t.dataset.t;modal(ty==='in'?'Cash in':'Cash out',`<label for="cmA">Amount (₱)</label><input type="number" id="cmA" min="0" step="0.01"><label for="cmR">Reason</label><input type="text" id="cmR" placeholder="${ty==='in'?'e.g. Additional change fund':'e.g. Bought ice, paid rider'}">`,[{label:'Cancel',on:closeModal},{label:'Save',cls:'primary',on:()=>{const a=num('cmA');if(a<=0||!val('cmR'))return toast('Amount and reason required',true);openShift().cashMoves.push({ts:Date.now(),type:ty,amount:r2(a),reason:val('cmR')});audit('cash '+ty,peso(a)+' '+val('cmR'));save();closeModal();renderShift()}}])},
  xread:()=>printHTML(shiftReportHTML(openShift(),'X-READING (SHIFT)')),
  shiftRpt:t=>{const sh=DB.shifts.find(s=>s.id===t.dataset.id);const html=shiftReportHTML(sh,sh.status==='closed'?'SHIFT CLOSING REPORT':'X-READING (SHIFT)');modal('Shift report',html,[{label:'Print',cls:'primary',on:()=>printHTML(html)},{label:'Close',on:closeModal}],{nofocus:true})},
  closeShift:()=>{const sh=openShift();const v=val('countCash');if(v==='')return toast('Enter the counted cash',true);
    if(DB.held.some(h=>h.userId===S.user.id&&h.branchId===S.branchId))return toast('You still have saved / held orders. Complete or delete them first.',true);
    const c=shiftCalc(sh);const counted=r2(+v);const variance=r2(counted-c.expected);
    confirmBox(`Expected cash <b>${peso(c.expected)}</b><br>Counted <b>${peso(counted)}</b><br>${variance===0?'Balanced ✅':variance<0?'Short by <b style="color:var(--bad)">'+peso(-variance)+'</b>':'Over by <b>'+peso(variance)+'</b>'}<br><br>Close the shift?`,()=>{
      Object.assign(sh,{status:'closed',closeTs:Date.now(),expected:c.expected,counted,variance});audit('shift close',`expected ${peso(c.expected)} counted ${peso(counted)} var ${peso(variance)}`);save();
      const html=shiftReportHTML(sh,'SHIFT CLOSING REPORT');renderApp();modal('Shift closed',html,[{label:'Print',cls:'primary',on:()=>printHTML(html)},{label:'Done',on:closeModal}],{nofocus:true})},'Close shift','danger')},
  // inventory
  invTab:t=>{S.tab.inv=t.dataset.k;renderInventory()},receive:receiveModal,transfer:transferModal,adjust:t=>adjustModal(t.dataset.id),
  rvScan:()=>{const keep={q:val('rvQ'),ref:val('rvRef')};cameraScan(code=>{const p=DB.products.find(x=>x.barcode===code||x.sku===code);receiveModal();if(p&&p.track)$('#rvP').value=p.id;else toast('No tracked product with that barcode',true);$('#rvQ').value=keep.q;$('#rvRef').value=keep.ref})},
  editProd:t=>{if(!can('products'))return;editProdModal(t.dataset.id)},editCats:catsModal,labels:labelsModal,
  lbAll:t=>$$('.lbN').forEach(i=>i.value=t.dataset.v),
  delProd:t=>{const p=prodById(t.dataset.id);closeModal();confirmBox(`Delete <b>${esc(p.name)}</b>? Past sales keep their records. To just hide it, untick Active instead.`,()=>{DB.products=DB.products.filter(x=>x.id!==p.id);audit('product delete',p.name);save();renderInventory()},'Delete','danger')},
  pickImg:()=>$('#imgIn').click(),rmImg:()=>{EDIT_IMG='';$('#epImgBox').innerHTML=esc(val('epE')||'📦')},
  epGen:()=>{const c=genBarcode();$('#epB').value=c;$('#epBprev').innerHTML=code128svg(c,36)},
  epScan:()=>{const snap=$('#modalRoot').firstElementChild;const holder=document.createElement('div');holder.appendChild(snap);const acts=MODAL_ACTS,img=EDIT_IMG;
    cameraScan(code=>{$('#modalRoot').innerHTML='';$('#modalRoot').appendChild(holder.firstElementChild);MODAL_ACTS=acts;EDIT_IMG=img;$('#epB').value=code;$('#epBprev').innerHTML=code128svg(code,36)})},
  genAllBarcodes:()=>{const miss=DB.products.filter(p=>!p.barcode);if(!miss.length)return toast('Every product already has a barcode');confirmBox(`Create barcodes for ${miss.length} product(s) without one?`,()=>{miss.forEach(p=>p.barcode=genBarcode());save();renderInventory();toast(miss.length+' barcodes created')},'Create')},
  bulkPhotos:()=>$('#bulkIn').click(),
  exportStock:()=>{const rows=[['SKU','Barcode','Product','Category','Unit','On hand','Low at','Cost','Stock value','Expiry','Lot']];DB.products.filter(p=>p.track).forEach(p=>{const s=stockOf(S.branchId,p.id);rows.push([p.sku,p.barcode,p.name,p.cat,p.unit,s,p.lowAt,p.cost,r2(Math.max(0,s)*p.cost),p.expiry,p.lot])});downloadText(`stock_${curBranch().code}_${today()}.csv`,toCSV(rows),'text/csv')},
  // reports
  repMode:t=>{const f=S.tab.rep;if(t.dataset.m==='custom'){const [a,b]=repRange(f);f.from=a;f.to=b}f.mode=t.dataset.m;renderReports()},
  repStep:t=>{shiftAnchor(S.tab.rep,+t.dataset.d);renderReports()},
  repXlsx:()=>{const {R,f}=S._rep;const sh=reportSheets(R,f);if(AL().enabled)sh.push(...insightsSheets(stockInsights(f.bid==='all'?S.branchId:f.bid)));saveFile(`${fileStem()}_${MODE_NAME[f.mode]}_Report_${R.from}_to_${R.to}.xlsx`,buildXLSX(sh))},
  repPdf:()=>{const {R,f}=S._rep;saveFile(`${fileStem()}_${MODE_NAME[f.mode]}_Report_${R.from}_to_${R.to}.pdf`,reportPDF(R,f))},
  goInsights:()=>{S.view='inventory';S.tab.inv='insights';renderApp()},bell:alertsModal,
  insToggle:()=>{S.tab.insOpen=!S.tab.insOpen;renderInventory()},
  insXlsx:()=>{saveFile(`${fileStem()}_Stock_Alerts_${today()}.xlsx`,buildXLSX(insightsSheets(stockInsights(S.branchId))))},
  insPdf:()=>{const pdf=new PDF();pdf.header('Stock Alerts & Planning',fdate(today())+' · '+curBranch().name);insightsPDF(pdf,stockInsights(S.branchId),true);saveFile(`${fileStem()}_Stock_Alerts_${today()}.pdf`,pdf.blob())},
  applyMin:()=>{const I=stockInsights(S.branchId);const rows=I.rows.filter(r=>r.minS>0);if(!rows.length)return toast('No sales history yet to calculate minimums',true);
    confirmBox(`Set the low-stock alert level of <b>${rows.length}</b> product(s) to their calculated minimum stock? Products with no recent sales keep their current level.`,()=>{rows.forEach(r=>r.p.lowAt=r.minS);audit('min stock','applied to '+rows.length+' products');save();renderInventory();toast('Alert levels updated')},'Apply')},
  exportSales:()=>{const f=S._rep.R;const rows=[['Invoice','Order no.','Date','Time','Branch','Cashier','Status','Order type','Table','Name',ST().staffLabel,'Discount type','Gross','Discount','Less VAT','VATable','VAT','VAT-exempt','Total','Payments','Customer','Customer TIN','SC/PWD ID','Rx doctor','Void reason']];
    f.all.forEach(s=>rows.push([s.invNo,s.orderNo||'',dayKey(s.ts),ftime(s.ts),(branchById(s.branchId)||{}).name,(userById(s.userId)||{}).name,s.status,s.orderType||'',s.table||'',s.orderName||'',s.attendant||'',s.discType,s.gross,s.discount,s.lessVat,s.vatable,s.vat,s.exempt,s.total,s.payments.map(p=>p.method+' '+p.amount).join(' | '),s.customer.name||s.sc.name,s.customer.tin,s.sc.id,s.rx?s.rx.doctor+' ('+s.rx.license+')':'',s.voidReason||'']));
    downloadText(`sales_${f.from}_to_${f.to}.csv`,toCSV(rows),'text/csv')},

  zread:zreadModal,
  // admin
  admTab:t=>{S.tab.adm=t.dataset.k;renderAdmin()},editUser:t=>editUserModal(t.dataset.id),editBranch:t=>editBranchModal(t.dataset.id),
  admTheme:t=>{ST().theme={preset:t.dataset.k,pri:'',acc:'',font:''};save();renderApp()},
  saveFeat:()=>{const s=ST();$$('.ftk').forEach(c=>s.feat[c.dataset.k]=c.checked);if(PRESET)Object.keys(s.feat).forEach(k=>{if(!(k in FEAT_LABEL))s.feat[k]=false});s.orderTypes=val('stOT').split(',').map(x=>x.trim()).filter(Boolean);if(!s.orderTypes.length)s.orderTypes=['Dine-in','Take-out'];s.staffLabel=val('stSL')||'Staff';s.staff=val('stStaff').split(',').map(x=>x.trim()).filter(Boolean);
    const pm=val('stPM').split(',').map(x=>x.trim()).filter(Boolean);s.payMethods=['Cash',...pm.filter(x=>x.toLowerCase()!=='cash')];audit('settings','features');save();S.cart=Object.assign(newCart(),{lines:S.cart.lines});toast('Features saved');renderApp()},
  applyBiz:()=>{const k=val('stBiz');const T=BIZ[k];
    modal('Apply '+esc(T.name),`<p>This switches features and the theme to suit a ${esc(T.name.toLowerCase())}.</p><label class="ck"><input type="checkbox" id="abSamples"> Also add its ${T.items.length} sample products and categories</label>`,[{label:'Cancel',on:closeModal},{label:'Apply',cls:'primary',on:()=>{
      const s=ST();s.bizType=k;s.feat=Object.assign({},FEAT_DEF,T.feat);s.theme={preset:T.theme,pri:'',acc:'',font:''};if(T.staff&&!s.staff.length)s.staff=T.staff.slice();if(T.staffLabel)s.staffLabel=T.staffLabel;
      if($('#abSamples').checked){const {products,stock}=templateProducts(k,DB.branches);products.forEach(p=>{if(DB.products.some(x=>x.sku===p.sku))p.sku=p.sku+'-'+k.slice(0,2).toUpperCase();DB.products.push(p)});Object.keys(stock).forEach(b=>Object.assign(DB.stock[b]||(DB.stock[b]={}),stock[b]));T.cats.forEach(c=>{if(!DB.categories.includes(c))DB.categories.push(c)})}
      audit('business type',T.name);save();closeModal();S.cart=Object.assign(newCart(),{lines:S.cart.lines});renderApp();toast('Applied')}}])},
  vendorUnlock:()=>modal('Vendor code',`<p class="muted">Enter the code from your POS provider (SetupGo).</p><input type="password" id="vcIn" inputmode="numeric" maxlength="8" autocomplete="off">`,[{label:'Cancel',on:closeModal},{label:'Unlock',cls:'primary',on:()=>{const s=ST();if(hashPin(s.vendorSalt,val('vcIn'))!==s.vendorHash){audit('vendor unlock','failed');save();return toast('Wrong vendor code',true)}S.vendorOK=true;audit('vendor unlock','ok');save();closeModal();renderAdmin()}}]),
  saveSettings:()=>{const s=ST();const lk=s.vendorHash&&!S.vendorOK;Object.assign(s,{tradeName:lk?s.tradeName:(val('stTrade')||s.tradeName),regName:lk?s.regName:val('stReg'),tin:lk?s.tin:val('stTin'),vatReg:val('stVat')==='1',vatRate:num('stRate'),scRate:num('stSc'),min:val('stMin'),serial:val('stSer'),ptu:val('stPtu'),ptuDate:val('stPtuD'),supplier:val('stSup'),accrNo:val('stAcc'),width:val('stW'),allowNeg:val('stNeg')==='1',footer:val('stFoot')});audit('settings','updated');save();toast('Settings saved');renderApp()},
  backup:()=>{audit('backup','exported');flush();downloadText(`setupgo_pos_backup_${today()}.json`,JSON.stringify(DB),'application/json')},
  restore:()=>$('#fileIn').click(),demoSales,exportStandalone:exportStandaloneModal,frFinish:finishFirstRun,
  resetAll:()=>confirmBox('This permanently deletes ALL sales, products, users and settings on this device. Export a backup first. Continue?',async()=>{await wipe();DB=null;S.user=null;WZ=null;if(PRESET&&PRESET.full){DB=JSON.parse(JSON.stringify(PRESET.data));DB.session=null;flush();renderLogin()}else if(PRESET)renderFirstRun();else renderWizard();toast('All data reset')},'Delete everything','danger'),
};
function setLineQty(i,q){
  const l=S.cart.lines[i];if(!l)return;const p=prodById(l.pid);
  if(q<=0)S.cart.lines.splice(i,1);
  else{if(p&&!l.custom&&!lineStockOK(p,q,i))return;l.qty=r3(q)}
  renderCart();renderGrid();
}
document.addEventListener('click',e=>{const t=e.target.closest('[data-act]');if(!t)return;const f=ACT[t.dataset.act];if(f){if(t.dataset.act!=='ovl')e.preventDefault();f(t,e)}});
const ON={
  search:t=>{S.q=t.value;renderGrid()},
  branch:t=>{if(S.cart.lines.length){t.value=S.branchId;return toast('Finish or clear the current order before switching branch',true)}S.branchId=t.value;DB.session.branchId=S.branchId;save();renderApp()},
  salesF:()=>{const f=S.tab.sales;f.date=val('sDate')||today();f.q=val('sQ');if($('#sBr'))f.bid=val('sBr');if($('#sMine'))f.mine=$('#sMine').checked;const foc=document.activeElement&&document.activeElement.id;const pos=$('#sQ').selectionStart;renderSales();if(foc==='sQ'){const q=$('#sQ');q.focus();q.setSelectionRange(pos,pos)}},
  repF:()=>{const f=S.tab.rep;if($('#rFrom')){f.from=val('rFrom')||f.from;f.to=val('rTo')||f.to}if($('#rAnchor'))f.anchor=val('rAnchor')||f.anchor;if($('#rBr'))f.bid=val('rBr');renderReports()},
  insF:()=>{const A=AL();A.basis=val('alBasis');A.lead=Math.max(0,num('alLead'));A.service=+val('alSvc');A.coverDays=Math.max(1,num('alCover'));A.nonMovingDays=Math.max(1,num('alNM'));A.expiryDays=Math.max(1,num('alExp'));save();renderInventory()},
  invQ:t=>{S.tab.invQ=t.value;const pos=t.selectionStart;renderInventory();const q=$('#invQ');q.focus();q.setSelectionRange(pos,pos)},
  prodQ:t=>{S.tab.prodQ=t.value;const pos=t.selectionStart;renderInventory();const q=$('#prodQ');q.focus();q.setSelectionRange(pos,pos)},
  denom:()=>{let s=0;[1000,500,200,100,50,20,10,5,1].forEach(d=>s+=d*(parseFloat(val('dn'+d))||0));s+=parseFloat(val('dnC'))||0;$('#countCash').value=r2(s).toFixed(2)},
  wzColor:()=>{WZ.theme.pri=val('wPri');WZ.theme.acc=val('wAcc');WZ.theme.font=val('wFont');applyTheme(WZ.theme)},
  admColor:()=>{const th=ST().theme;th.pri=val('thPri');th.acc=val('thAcc');th.font=val('thFont');applyTheme(th);save()},
};
const LIVE=['search','salesF','invQ','prodQ','denom','wzColor','admColor'];
document.addEventListener('input',e=>{const t=e.target,k=t.dataset&&t.dataset.on;if(k&&LIVE.includes(k)&&(t.type==='search'||t.type==='number'||t.type==='color'))ON[k](t)});
document.addEventListener('change',e=>{const t=e.target;if(t.classList&&t.classList.contains('alk')){AL()[t.dataset.k]=t.checked;audit('alerts',t.dataset.k+' '+(t.checked?'on':'off'));save();renderApp();return}if(t.id==='lgUser'){LOGIN.username=t.value;LOGIN.pin='';drawDots();return}const k=t.dataset&&t.dataset.on;if(k&&t.type!=='search'&&t.type!=='color'&&!(t.type==='number'&&LIVE.includes(k)))ON[k](t);if(k==='admColor'&&t.type==='color')renderApp()});

// keyboard: PIN typing, USB/Bluetooth barcode scanners (fast keystrokes + Enter), modal Enter/Escape
let SCAN={buf:'',t:0};
document.addEventListener('keydown',e=>{
  if(DB&&!S.user&&$('#pindots')&&!e.target.matches('select,input')){if(/^\d$/.test(e.key))ACT.pin({dataset:{k:e.key}});else if(e.key==='Backspace'){LOGIN.pin=LOGIN.pin.slice(0,-1);drawDots()}else if(e.key==='Enter')doLogin();return}
  const modalOpen=!!$('#modalRoot').innerHTML;
  if(e.key==='Escape'&&modalOpen){PAY=null;OPT=null;closeModal();return}
  if(S.user&&S.view==='sell'&&!modalOpen){
    const now=Date.now();
    if(e.key==='Enter'){
      const fast=SCAN.buf.length>=4&&now-SCAN.t<80;
      if(fast||e.target.id==='q'){e.preventDefault();const code=fast?SCAN.buf:val('q');SCAN.buf='';
        if(e.target.id==='q'){$('#q').value='';S.q='';}
        const ok=handleScan(code,!fast);if(!ok&&!fast&&e.target.id==='q'){$('#q').value=code;S.q=code}renderGrid();return}
      SCAN.buf='';return}
    if(e.key.length===1&&!e.ctrlKey&&!e.metaKey){if(now-SCAN.t>80)SCAN.buf='';SCAN.buf+=e.key;SCAN.t=now}
    return;
  }
  if(e.key==='Enter'&&modalOpen&&e.target.matches('.modal input:not(#payAmt):not(#epB):not(.lbN)')){e.preventDefault();const b=$$('.modal-f .btn').pop();if(b&&!b.disabled)b.click()}
});
// file inputs
$('#fileIn').addEventListener('change',e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{const d=JSON.parse(r.result);if(!d.version||!d.users||!d.sales||!d.settings)throw 0;if(PRESET&&d.settings.presetId!==PRESET.id){toast('This backup belongs to a different store and cannot be restored here.',true);e.target.value='';return}confirmBox(`Restore backup of <b>${esc(d.settings.tradeName||'')}</b> with ${d.sales.length} sales, ${d.products.length} products and ${d.users.length} users? This replaces all data on this device.`,()=>{DB=d;DB.session=null;WZ=null;flush();S.user=null;renderLogin();toast('Backup restored — please log in')},'Restore','danger')}catch(x){toast('That is not a valid SetupGo POS backup',true)}e.target.value=''};r.readAsText(f)});
$('#imgIn').addEventListener('change',async e=>{const f=e.target.files[0];e.target.value='';if(!f)return;try{EDIT_IMG=await resizeImage(f,240);const b=$('#epImgBox');if(b)b.innerHTML=`<img src="${EDIT_IMG}" style="width:100%;height:100%;object-fit:cover" alt="">`}catch(x){toast('Could not read that image',true)}});
$('#logoIn').addEventListener('change',async e=>{const f=e.target.files[0];e.target.value='';if(!f)return;try{const d=await resizeImage(f,256,false);if(WZ){WZ.logo=d;renderWizard()}else{ST().logo=d;save();renderApp()}}catch(x){toast('Could not read that image',true)}});
$('#bulkIn').addEventListener('change',async e=>{const files=[...e.target.files];e.target.value='';if(!files.length)return;let ok=0;const miss=[];
  for(const f of files){const base=f.name.replace(/\.[^.]+$/,'').trim().toLowerCase();const p=DB.products.find(x=>x.sku.toLowerCase()===base||(x.barcode&&x.barcode===base)||x.name.toLowerCase()===base);
    if(!p){miss.push(f.name);continue}try{p.img=await resizeImage(f,240);ok++}catch(x){miss.push(f.name)}}
  save();renderInventory();modal('Photo upload',`<p><b>${ok}</b> photo(s) matched and saved.</p>${miss.length?`<p class="muted">Not matched (${miss.length}): ${esc(miss.slice(0,20).join(', '))}${miss.length>20?'…':''}</p><p class="muted small">Name each file after the product's SKU, barcode or exact name.</p>`:''}`,[{label:'OK',cls:'primary',on:closeModal}])});

// ---------- boot ----------
(async function boot(){
  await load();
  if(!DB&&PRESET){if(PRESET.full){DB=JSON.parse(JSON.stringify(PRESET.data));DB.session=null;flush();renderLogin();return}renderFirstRun();return}
  if(!DB){renderWizard();return}
  if(DB.session){const u=userById(DB.session.userId);if(u&&u.active){S.user=u;S.branchId=u.branchId||DB.session.branchId||DB.branches[0].id;if(!branchById(S.branchId))S.branchId=DB.branches[0].id;S.cart=newCart()}}
  if(S.user)renderApp();else renderLogin();
})();
</script>
</body>
